name: auto-audit-news

services:
  chroma-alfa:
    image: chromadb/chroma:1.5.9
    command: ["run", "--host", "0.0.0.0", "--port", "8000", "--path", "/chroma/chroma"]
    volumes:
      - alfa-chroma:/chroma/chroma
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [private]

  chroma-methodology:
    image: chromadb/chroma:1.5.9
    command: ["run", "--host", "0.0.0.0", "--port", "8000", "--path", "/chroma/chroma"]
    volumes:
      - methodology-chroma:/chroma/chroma
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [private]

  api:
    build:
      context: .
      dockerfile: company_news_pipeline/Dockerfile
    command: ["gunicorn", "--bind=0.0.0.0:5000", "--workers=1", "--timeout=300", "webhook_server:app"]
    environment:
      NEWS_ANALYTICS_DB: /app/data/news_analytics.sqlite3
      NEWS_ANALYTICS_CHROMA_ALFA_RESEARCH_HOST: chroma-alfa
      NEWS_ANALYTICS_CHROMA_ALFA_RESEARCH_PORT: "8000"
      NEWS_ANALYTICS_CHROMA_RISK_METHODOLOGY_HOST: chroma-methodology
      NEWS_ANALYTICS_CHROMA_RISK_METHODOLOGY_PORT: "8000"
      RUSPROFILE_STORAGE_STATE: /run/secrets/rusprofile_storage_state
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      ROUTERAI_EGRESS_PROXY: ${ROUTERAI_EGRESS_PROXY:-}
      ROUTERAI_EMBEDDING_RUB_PER_1M_TOKENS: ${ROUTERAI_EMBEDDING_RUB_PER_1M_TOKENS:-1.10}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports: ["${NEWS_API_BIND:-127.0.0.1}:${NEWS_API_PORT:-5000}:5000"]
    volumes:
      - analytics-data:/app/data
      - ./company_news_pipeline/data/mock:/app/company_news_pipeline/data/mock:ro
      - ./data/alfa_research:/app/data/alfa_research:ro
      - ./company_news_pipeline/data/methodology_sources:/app/company_news_pipeline/data/methodology_sources:ro
      - ./.local/rusprofile_storage_state.json:/run/secrets/rusprofile_storage_state:ro
    depends_on:
      chroma-alfa: {condition: service_healthy}
      chroma-methodology: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/companies', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 5
    restart: unless-stopped
    networks: [private, egress]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}

  news-worker:
    build:
      context: .
      dockerfile: company_news_pipeline/Dockerfile
    command: ["python", "-m", "news_analytics.search.scheduler"]
    environment:
      NEWS_ANALYTICS_DB: /app/data/news_analytics.sqlite3
      NEWS_ANALYTICS_CHROMA_ALFA_RESEARCH_HOST: chroma-alfa
      NEWS_ANALYTICS_CHROMA_ALFA_RESEARCH_PORT: "8000"
      NEWS_ANALYTICS_CHROMA_RISK_METHODOLOGY_HOST: chroma-methodology
      NEWS_ANALYTICS_CHROMA_RISK_METHODOLOGY_PORT: "8000"
      SERPER_API_KEY: ${SERPER_API_KEY:-}
    volumes:
      - analytics-data:/app/data
      - ./company_news_pipeline/data/mock:/app/company_news_pipeline/data/mock:ro
      - ./data/alfa_research:/app/data/alfa_research:ro
    depends_on:
      chroma-alfa: {condition: service_healthy}
      chroma-methodology: {condition: service_healthy}
    restart: unless-stopped
    networks: [private, egress]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 4G}

  ingest:
    build:
      context: .
      dockerfile: company_news_pipeline/Dockerfile
    profiles: [ingest]
    command: ["python", "-m", "news_analytics.bootstrap"]
    environment:
      NEWS_ANALYTICS_DB: /app/data/news_analytics.sqlite3
      NEWS_ANALYTICS_CHROMA_ALFA_RESEARCH_HOST: chroma-alfa
      NEWS_ANALYTICS_CHROMA_ALFA_RESEARCH_PORT: "8000"
      NEWS_ANALYTICS_CHROMA_RISK_METHODOLOGY_HOST: chroma-methodology
      NEWS_ANALYTICS_CHROMA_RISK_METHODOLOGY_PORT: "8000"
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:-}
      ROUTERAI_EGRESS_PROXY: ${ROUTERAI_EGRESS_PROXY:-}
      ROUTERAI_EMBEDDING_RUB_PER_1M_TOKENS: ${ROUTERAI_EMBEDDING_RUB_PER_1M_TOKENS:-1.10}
    volumes:
      - analytics-data:/app/data
      - ./company_news_pipeline/data/mock:/app/company_news_pipeline/data/mock:ro
      - ./data/alfa_research:/app/data/alfa_research:ro
      - ./company_news_pipeline/data/methodology_sources:/app/company_news_pipeline/data/methodology_sources:ro
    depends_on:
      chroma-alfa: {condition: service_healthy}
      chroma-methodology: {condition: service_healthy}
    networks: [private, egress]
    restart: "no"

volumes:
  analytics-data:
  alfa-chroma:
  methodology-chroma:

networks:
  private:
    internal: true
  egress:
    driver: bridge
